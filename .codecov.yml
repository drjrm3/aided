coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: 90%
        threshold: 0%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
