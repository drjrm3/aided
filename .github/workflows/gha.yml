name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # -----------------------------
      # Check out code
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # Set up Python per matrix
      # -----------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------
      # Build aided
      # -----------------------------
      - name: Build
        run: |
          pip install .

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Pytest + coverage plugin + Pylint + Codecov uploader
          pip install pytest pytest-cov pylint codecov

      # -----------------------------
      # Pylint (with fail-under)
      # -----------------------------
      - name: Run Pylint
        run: |
          # The --fail-under=9 argument will make Pylint exit non-zero
          # if your code's rating is < 9.0/10, causing the job to fail.
          pylint \
            --ignore=tests,version.py \
            --fail-under=9 \
            aided

      # -----------------------------
      # Pytest Coverage
      # -----------------------------
      - name: Run Pytest with Coverage
        run: |
          pwd
          ls test/data/
          ls test/data/msda/g09
          ls /home/runner/work/aided/aided/test/data/msda
          ls /home/runner/work/aided/aided/test/data/msda/g09
          ls /home/runner/work/aided/aided/test/data/msda/g09/formamide.b3lyp.6311gss.log
          export PYTHONPATH=$(pwd)/test:$PYTHONPATH
          pytest \
            --cov=aided \
            --cov-report=xml \
            --cov-report=term \
            --disable-warnings \
            --ignore=test/speed_tests \
            --ignore=_skbuild

      # -----------------------------
      # Update codecov
      # -----------------------------
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
